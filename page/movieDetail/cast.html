<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Cast & Crew</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .crewContainer {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
        font-family: Arial, sans-serif;
        display: flex;
        gap: 50px;
      }
      .castColumn,
      .crewColumn {
        flex: 1;
      }
      .memberRow {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
      }
      .memberRow img {
        width: 60px;
        height: 75px;
        object-fit: cover;
        border-radius: 5px;
      }
      .memberInfo h4 {
        margin: 0 0 5px 0;
        font-size: 1.1em;
        color: black;
      }
      .memberInfo p {
        margin: 0;
        color: #555;
        font-size: 0.9em;
      }
      .backBtn {
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
        color: #01b4e4;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="crewContainer">
      <div class="castColumn">
        <a
          href="#"
          onclick="
            history.back();
            return false;
          "
          class="backBtn"
          >← Back to movie</a
        >
        <h2>Cast (<span id="castCount">0</span>)</h2>
        <div id="fullCast"></div>
      </div>

      <div class="crewColumn">
        <h2>Crew (<span id="crewCount">0</span>)</h2>
        <div id="fullCrew"></div>
      </div>
    </div>

    <script>
      // URL dan ID ni olamiz
      let id = window.location.href.slice(
        window.location.href.indexOf("=") + 1,
      );
      const MEDIAL_LINK = "https://media.themoviedb.org/t/p/w200";

      const options = {
        method: "GET",
        headers: {
          accept: "application/json",
          Authorization:
            "Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI5NzllMWNhOTFjMzQyMWJiZTY2MGNjYmQ5ODZiYTYxMCIsIm5iZiI6MTc3OTY0ODk3OS41MTQsInN1YiI6IjZhMTM0OWQzNjAzNzI5MDcyOWRiNWMyYSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.tUFtBTtFOKeibppmy2k3CvYVpFTtsBGJ_AwZA9BCGqE",
        },
      };

      async function loadFullCredits() {
        try {
          let res = await fetch(
            `https://api.themoviedb.org/3/movie/${id}/credits?language=en-US`,
            options,
          );
          let data = await res.json();

          document.getElementById("castCount").innerText = data.cast.length;
          document.getElementById("crewCount").innerText = data.crew.length;

          // 1. BUTUN AKTYORLAR RO'YXATI
          let castHtml = "";
          data.cast.forEach((actor) => {
            let img = actor.profile_path
              ? MEDIAL_LINK + actor.profile_path
              : "https://via.placeholder.com/60x75?text=No+Image";
            castHtml += `
            <div class="memberRow">
              <img src="${img}" alt="${actor.name}">
              <div class="memberInfo">
                <h4>${actor.name}</h4>
                <p>${actor.character}</p>
              </div>
            </div>`;
          });
          document.getElementById("fullCast").innerHTML = castHtml;

          // 2. BUTUN JAMOA (CREW) RO'YXATI
          let crewHtml = "";
          data.crew.forEach((person) => {
            let img = person.profile_path
              ? MEDIAL_LINK + person.profile_path
              : "https://via.placeholder.com/60x75?text=No+Image";
            crewHtml += `
            <div class="memberRow">
              <img src="${img}" alt="${person.name}">
              <div class="memberInfo">
                <h4>${person.name}</h4>
                <p>${person.job} (${person.department})</p>
              </div>
            </div>`;
          });
          document.getElementById("fullCrew").innerHTML = crewHtml;
        } catch (error) {
          console.error("Xatolik yuz berdi:", error);
        }
      }

      loadFullCredits();
    </script>
  </body>
</html>
